            <label for="renderScale">Render Scale: <span id="renderScaleValue">2x</span></label>
            <input type="range" id="renderScale" min="1" max="5" value="2" step="0.5">
        </div>

    <script>
        // Check if p5.js is loaded
        window.onload = function() {
            if (typeof p5 === 'undefined') {
                document.getElementById('loading').innerHTML = 'Error: p5.js failed to load!';
            } else {
                document.getElementById('loading').style.display = 'none';
            }
        };
    </script>
    <script src="simulation.js"></script>
    <script src="ui.js"></script>
    <script src="render.js"></script>
